name: Build and Test

on:
  push:
    branches: [ main, master, develop, "feature/**" ]  # Runs on main release and feature branches
    tags: [ 'v*.*.*' ]  # Ensure CI runs for version tags too
  pull_request:
    branches: [ main, master, develop ]  # Also runs on PRs to main/master/develop
  workflow_dispatch:  # Allow manual triggering

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate-workflows:
    name: Validate Workflow Syntax
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate GitHub Actions workflows
      shell: bash
      run: |
        set -euo pipefail

        echo "📋 Installing actionlint for workflow validation..."
        mkdir -p /tmp/actionlint
        cd /tmp/actionlint

        # Download the official installer script and run it
        curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash

        # Ensure the binary is executable
        chmod +x ./actionlint
        echo "✅ Actionlint installed"

        echo "📝 Validating workflow files..."
        # Assume we're already in the GitHub workspace; if not, uncomment the next line:
        # cd "$GITHUB_WORKSPACE"

        WORKFLOW_DIR=".github/workflows"

        # Optional: check existence to provide a friendly message
        if [ ! -d "$WORKFLOW_DIR" ]; then
          echo "ℹ️ No workflows directory found at $WORKFLOW_DIR. Skipping validation."
          exit 0
        fi

        # Run actionlint directly on the workflows directory (recursively)
        # This covers both .yml and .yaml automatically.
        if /tmp/actionlint/actionlint -color always "$WORKFLOW_DIR"; then
          echo "✅ All workflows are syntactically valid"
        else
          echo "❌ Workflow validation failed"
          exit 1
        fi

  scan-dependencies:
    name: Scan for Vulnerable Dependencies
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Detect project type
      id: detect
      shell: bash
      run: |
        project_type="unknown"

        if find . -type f -name "*.csproj" -print -quit | grep -q .; then
          project_type="dotnet"
        fi

        # Write to GitHub Actions output if available; otherwise print to stdout for local testing
        if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
          printf "project_type=%s\n" "$project_type" >> "$GITHUB_OUTPUT"
        else
          printf "project_type=%s\n" "$project_type"
        fi

    # .NET vulnerability scanning
    - name: Run dotnet list package (dotnet)
      if: ${{ steps.detect.outputs.project_type == 'dotnet' }}
      shell: bash
      run: |
        echo "🔍 Scanning .NET dependencies for vulnerabilities..."
        dotnet tool install --global dotnet-outdated-tool > /dev/null 2>&1 || true
        dotnet outdated || echo "⚠️  Review outdated packages above"

  build-test:
    name: Build and Test
    needs: [validate-workflows, scan-dependencies]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore -nologo

    - name: Build solution
      run: dotnet build --configuration Release

    - name: Run tests
      run: dotnet test --configuration Release --verbosity normal --logger trx --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: ./TestResults/*.trx

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: ./TestResults/**/coverage.cobertura.xml

    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: matrix.os == 'ubuntu-latest'
      with:
        filename: ./TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
      with:
        recreate: true
        path: code-coverage-results.md

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run dotnet format
      run: dotnet format --verify-no-changes --verbosity diagnostic

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  package:
    name: Create NuGet Package
    runs-on: ubuntu-latest
    needs: [build-test, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Create NuGet package
      run: dotnet pack src/Middleware.csproj --configuration Release --no-build --output ./packages

    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./packages/*.nupkg

    - name: Upload NuGet symbols
      uses: actions/upload-artifact@v4
      with:
        name: nuget-symbols
        path: ./packages/*.snupkg
